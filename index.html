<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamifikasi Alfaqih – Pendidikan Islam Tingkatan 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
.hero{text-align:center;padding:40px 20px 26px}
.hero .gtitle{font-size:clamp(2.6rem,8vw,5rem)}
.stats2{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.tab{padding:10px 18px;border-radius:999px;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:1rem}
.tab.on{background:linear-gradient(135deg,var(--a),var(--b));color:#0A0F25}
.sec h2{font-size:1.5rem;margin:26px 4px 12px;font-weight:900;display:flex;align-items:center;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.gc{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:20px;text-decoration:none;color:var(--txt);min-height:190px;overflow:hidden;
 background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.02));border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.gc::before{content:'';position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--ca),transparent 70%);opacity:.55}
.gc:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 2px var(--ca)}
.gc .no{font-weight:900;letter-spacing:2px;font-size:.85rem;color:var(--ca)}
.gc .ic{font-size:2.6rem}
.gc .gn{font-weight:900;font-size:1.25rem;line-height:1.15}
.gc .tt{font-weight:600;color:var(--mut);font-size:.95rem;line-height:1.3}
.gc .pr{margin-top:auto;display:flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem}
.gc .pr .bar{flex:1;height:10px}
.gc .cp{position:absolute;right:12px;top:12px;z-index:2;padding:6px 10px;border-radius:10px;font-weight:800;font-size:.85rem;background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--txt)}
.gc .cp:hover{background:var(--ca);color:#0A0F25}
.gc .chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}.gc .chips span{font-size:.72rem;font-weight:800;padding:3px 7px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.gc .pr .bar i{background:linear-gradient(90deg,var(--ca),var(--gold))}
</style>
</head>
<body data-share-title="Gamifikasi Alfaqih – Semua Game Tingkatan 3">
<div class="wrap">
 <div class="glass hero">
  <div class="kicker">🎮 Pendidikan Islam · Tingkatan 3 · KSSM</div>
  <div class="emblem">🏆</div>

  <div class="gsub">27 game · 135 misi · 20 jenis permainan · Nota flash card setiap pelajaran!</div>
  <div class="stats2"><div class="pill">⭐ <span id="ts">0</span> / 405 bintang</div><div class="pill">✅ <span id="td">0</span> / 27 tamat</div></div>
 </div>
 <div class="tabs" id="tabs"></div>
 <div id="list"></div>
 <div class="foot"><span class="pw">@powered by alfaqih</span></div>
</div>
<script>
const L=[{"id":"p1","no":1,"bidang":"Al-Quran","title":"Allah Pengampun Segala Dosa (Surah al-A'raf, ayat 23)","game":"Pintu Taubat","a":"#34D399","b":"#22D3EE","icon":"🚪","t":["connect","swipe","treasure","match","team"]},{"id":"p2","no":2,"bidang":"Al-Quran","title":"Al-Quran Petunjuk Kebenaran (Surah al-Kahfi, ayat 1–10)","game":"Kompas Al-Kahfi","a":"#38BDF8","b":"#A78BFA","icon":"🕯️","t":["chain","wordsearch","live","escape","levelup"]},{"id":"p3","no":3,"bidang":"Al-Quran","title":"Hukum Tajwid: Hukum Mad","game":"Lebuh Raya Mad","a":"#2EE59D","b":"#FFC83D","icon":"🎙️","t":["pick","sort","flash","timed","collect"]},{"id":"p4","no":4,"bidang":"Al-Quran","title":"Pancaindera yang Dimanfaatkan (Surah al-A'raf, ayat 179)","game":"Misi Pancaindera","a":"#60A5FA","b":"#2EE59D","icon":"👁️","t":["sort","connect","tower","mystery","ladder"]},{"id":"p5","no":5,"bidang":"Al-Quran","title":"Zikir Penenang Hati (Surah al-A'raf, ayat 205–206)","game":"Taman Zikir","a":"#2EE59D","b":"#A78BFA","icon":"📿","t":["match","swipe","wheel","maze","live"]},{"id":"p6","no":6,"bidang":"Al-Quran","title":"Generasi Unggul (Surah at-Taubah, ayat 100)","game":"Legasi Sahabat","a":"#FFC83D","b":"#34D399","icon":"🌟","t":["sort","crossword","timed","escape","boss"]},{"id":"p7","no":7,"bidang":"Al-Quran","title":"Kewajipan Memelihara Kehormatan Diri (Surah an-Nur, ayat 30–31)","game":"Perisai Maruah","a":"#F472B6","b":"#60A5FA","icon":"🛡️","t":["connect","swipe","tower","collect","levelup"]},{"id":"p8","no":8,"bidang":"Al-Quran","title":"Penciptaan Manusia Bukti Kekuasaan Allah (Surah Ghafir, ayat 67)","game":"Makmal Ciptaan","a":"#A78BFA","b":"#22D3EE","icon":"🧬","t":["order","picture","live","mystery","team"]},{"id":"p9","no":9,"bidang":"Hadis","title":"Sedekah Kunci Kebaikan","game":"Misi Seribu Sedekah","a":"#FFC83D","b":"#2EE59D","icon":"🤲","t":["connect","crossword","collect","maze","ladder"]},{"id":"p10","no":10,"bidang":"Hadis","title":"Hindari Sifat Negatif","game":"Pemburu Sifat Negatif","a":"#FF4D6D","b":"#FFC83D","icon":"💪","t":["sort","swipe","tower","flash","wheel"]},{"id":"p11","no":11,"bidang":"Akidah","title":"Allah Maha Kaya Pengurnia Rezeki (al-Ghani & ar-Razzaq)","game":"Khazanah Rezeki","a":"#FFC83D","b":"#34D399","icon":"💰","t":["sort","match","collect","timed","team"]},{"id":"p12","no":12,"bidang":"Akidah","title":"Beriman kepada Rasul (Konsep Kenabian & Sirah 25 Rasul)","game":"Galeri 25 Rasul","a":"#38BDF8","b":"#FFC83D","icon":"✨","t":["flash","wordsearch","treasure","ladder","mystery"]},{"id":"p13","no":13,"bidang":"Akidah","title":"Beriman kepada Hari Akhirat","game":"Perjalanan Abadi","a":"#A78BFA","b":"#FF4D6D","icon":"⏳","t":["order","sort","maze","swipe","boss"]},{"id":"p14","no":14,"bidang":"Akidah","title":"Beriman kepada Qada' dan Qadar","game":"Kod Takdir","a":"#22D3EE","b":"#2EE59D","icon":"🧩","t":["sort","connect","escape","wheel","live"]},{"id":"p15","no":15,"bidang":"Fiqh","title":"Konsep Fardu Ain dan Fardu Kifayah","game":"Misi Ain & Kifayah","a":"#2EE59D","b":"#38BDF8","icon":"⚖️","t":["sort","timed","swipe","team","picture"]},{"id":"p16","no":16,"bidang":"Fiqh","title":"Pengurusan Jenazah","game":"Misi Kafan Putih","a":"#E2E8F0","b":"#38BDF8","icon":"🕊️","t":["order","escape","swipe","levelup","treasure"]},{"id":"p17","no":17,"bidang":"Fiqh","title":"Zakat Penyuci Harta","game":"Bank Zakat","a":"#34D399","b":"#FFC83D","icon":"🪙","t":["sort","connect","collect","spin","tower"]},{"id":"p18","no":18,"bidang":"Fiqh","title":"Aidilfitri dan Aidiladha","game":"Pesta Dua Hari Raya","a":"#2EE59D","b":"#F472B6","icon":"🌙","t":["sort","wordsearch","live","mystery","wheel"]},{"id":"p19","no":19,"bidang":"Fiqh","title":"Qiamullail Pemangkin Kekuatan Jiwa","game":"Pahlawan Malam","a":"#6366F1","b":"#22D3EE","icon":"🌌","t":["order","swipe","match","timed","treasure"]},{"id":"p20","no":20,"bidang":"Fiqh","title":"Solat Sunat Tahiyatul Masjid dan Solat Sunat Hajat","game":"Tetamu Rumah Allah","a":"#38BDF8","b":"#2EE59D","icon":"🕌","t":["sort","flash","crossword","ladder","escape"]},{"id":"p21","no":21,"bidang":"Sirah dan Tamadun Islam","title":"Perjanjian Hudaibiyah dan Pembukaan Kota Makkah","game":"Misi Fathu Makkah","a":"#FFC83D","b":"#FF4D6D","icon":"🏳️","t":["order","treasure","swipe","tower","team"]},{"id":"p22","no":22,"bidang":"Sirah dan Tamadun Islam","title":"Tokoh Sahabat","game":"Galeri Empat Sahabat","a":"#F472B6","b":"#FFC83D","icon":"🏅","t":["spin","picture","match","levelup","live"]},{"id":"p23","no":23,"bidang":"Akhlak Islamiah","title":"Pemaaf Melunakkan Hati","game":"Hati Pemaaf","a":"#F472B6","b":"#22D3EE","icon":"💞","t":["sort","swipe","mystery","maze","ladder"]},{"id":"p24","no":24,"bidang":"Akhlak Islamiah","title":"Qanaah Hiasan Peribadi","game":"Jiwa Qanaah","a":"#34D399","b":"#A78BFA","icon":"🌿","t":["swipe","connect","wheel","escape","flash"]},{"id":"p25","no":25,"bidang":"Akhlak Islamiah","title":"Syukur Penyubur Iman","game":"Taman Syukur","a":"#FBBF24","b":"#10B981","icon":"🌻","t":["chain","sort","crossword","live","treasure"]},{"id":"p26","no":26,"bidang":"Akhlak Islamiah","title":"Adab Berkomunikasi","game":"Misi Bicara Mulia","a":"#60A5FA","b":"#F59E0B","icon":"💬","t":["sort","connect","timed","picture","tower"]},{"id":"p27","no":27,"bidang":"Akhlak Islamiah","title":"Adab Bermusafir","game":"Kembara Musafir","a":"#F97316","b":"#14B8A6","icon":"🧭","t":["sort","wordsearch","collect","levelup","team"]}];
const TL={"live": "📡 Live Quiz", "connect": "🔗 Matching", "timed": "⏱️ Timed", "escape": "🔐 Escape Room", "wheel": "🎰 Lucky Wheel", "tower": "🏰 Tower Defense", "collect": "💎 Point Collector", "crossword": "✏️ Crossword", "mystery": "🎁 Mystery Box", "team": "⚔️ Team Battle", "match": "🧠 Memory Match", "swipe": "👍 True/False", "maze": "🌀 Maze", "treasure": "🗺️ Treasure Hunt", "wordsearch": "🔎 Word Search", "spin": "🎡 Spin & Answer", "ladder": "📶 Leaderboard", "flash": "🃏 Flashcard Battle", "picture": "🖼️ Guess Picture", "levelup": "🚀 Level Up", "sort": "🗂️ Asingkan", "order": "🔢 Susun Tertib", "chain": "⛓️ Sambung Ayat", "pick": "🎯 Pilih Tepat", "boss": "👹 Lawan Bos"};
const B=[['Al-Quran','📖'],['Hadis','📜'],['Akidah','☝️'],['Fiqh','🕋'],['Sirah dan Tamadun Islam','🏛️'],['Akhlak Islamiah','💎']];
function prog(id){try{const v=JSON.parse(localStorage.getItem('alfaqih_t3_'+id));if(v&&v.st)return{s:v.st.reduce((a,x)=>a+x.stars,0),d:v.st.every(x=>x.stars>0)}}catch(e){}return{s:0,d:false}}
let cur='Semua';let TS=0,TD=0;
function render(){TS=0;TD=0;
 document.getElementById('tabs').innerHTML=['Semua',...B.map(b=>b[0])].map(t=>`<button class="tab ${t===cur?'on':''}" data-t="${t}">${t==='Semua'?'🌐 Semua':B.find(b=>b[0]===t)[1]+' '+t}</button>`).join('');
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{cur=b.dataset.t;render()});
 document.getElementById('list').innerHTML=B.filter(b=>cur==='Semua'||b[0]===cur).map(([bn,ic])=>`<div class="sec"><h2>${ic} ${bn}</h2><div class="grid3">${L.filter(l=>l.bidang===bn).map(l=>{const p=prog(l.id);return `<a class="gc" href="${l.id}/" style="--ca:${l.a}"><button class="cp" data-id="${l.id}" data-t="P${l.no} · ${l.game}">🔗 Link</button><div class="no">PELAJARAN ${l.no}${p.d?' · ✅ TAMAT':''}</div><div class="ic">${l.icon}</div><div class="gn">${l.game}</div><div class="tt">${l.title}</div><div class="chips">${l.t.map(t=>`<span>${TL[t]}</span>`).join("")}</div><div class="pr"><span>⭐ ${p.s}/15</span><div class="bar"><i style="width:${p.s/15*100}%"></i></div></div></a>`}).join('')}</div></div>`).join('');
 L.forEach(l=>{const p=prog(l.id);TS+=p.s;TD+=p.d?1:0});document.querySelectorAll('.gc .cp').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const u=new URL(b.dataset.id+'/',location.href).href;window.alfaqihShare?alfaqihShare(u,b.dataset.t):null});document.getElementById('ts').textContent=TS;document.getElementById('td').textContent=TD}
render();
</script>
